<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/CSS/Login-estilos/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
  <div class="Contenedor">
    <img class="Logotipo" src="../static/IMG/02.jpg" alt="Logotipo">
    <div class="Contenedordeadentro">
        <img src="../static/IMG/04" alt="Imagen">
        <div class="Contenedordesubadentro">
            <h1>Registrarse Usuario</h1>
            <!-- FORMULARIO DE REGISTRO CON TODOS LOS CAMPOS REQUERIDOS -->
            <form id="registerForm">
                <h3>Nombre:</h3>
                <input type="text" id="nombre" placeholder="Ingresar Nombre" required>
                
                <h3>Apellido:</h3>
                <input type="text" id="apellido" placeholder="Ingresar Apellido" required>
                
                <h3>Razón Social:</h3>
                <input type="text" id="razon_social" placeholder="Ingresar Razón Social" required>
                
                <h3>Correo Electrónico:</h3>
                <input type="email" id="email" placeholder="Ingresar Correo Electrónico" required>
                
                <h3>Teléfono:</h3>
                <input type="tel" id="telefono" placeholder="Ingresar Teléfono" required>
                
                <h3>Contraseña:</h3>
                <input type="password" id="password" placeholder="Ingresar Contraseña" required>
            </form>
        </div>
    </div>
    <div class="ContenedorSiguiente">
        <button type="submit" form="registerForm">
            Registrarse
        </button>
    </div>
</div>

<!-- SCRIPT DE REGISTRO ADAPTADO -->
<script>
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    // Crear objeto cliente con las claves que espera el backend
    const cliente = {
        nombre: document.getElementById("nombre").value.trim(),
        apellido: document.getElementById("apellido").value.trim(),
        razonSocial: document.getElementById("razon_social").value.trim(),
        email: document.getElementById("email").value.trim(),
        telefono: document.getElementById("telefono").value.trim(),
        password: document.getElementById("password").value.trim()
    };

    // Validación básica de campos
    if (!cliente.nombre || !cliente.apellido || !cliente.razonSocial || !cliente.email || !cliente.telefono || !cliente.password) {
        alert("❌ Por favor, complete todos los campos.");
        return;
    }

    // Validación de email
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(cliente.email)) {
        alert("❌ Por favor, ingrese un correo electrónico válido.");
        return;
    }

    try {
        const response = await fetch("http://localhost:8080/clientes/guardar", {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify(cliente)
        });

        if (response.ok) {
            const data = await response.json();

            // Guardar datos del cliente en sesión
            sessionStorage.setItem("clienteNombre", data.nombre);
            sessionStorage.setItem("clienteEmail", data.email);
            sessionStorage.setItem("clienteId", data.id || "");

            alert("✅ Registro exitoso. Bienvenido, " + data.nombre + "!");

            // Redirigir después de un segundo
            setTimeout(() => {
                window.location.href = "Index.html";
            }, 1000);

        } else {
            const errorText = await response.text();
            let errorMessage = "❌ Error al registrar: ";
            
            if (errorText.includes("Email already exists") || errorText.includes("email duplicado")) {
                errorMessage += "El correo electrónico ya está registrado.";
            } else if (response.status === 400) {
                errorMessage += "Datos inválidos. Verifique la información.";
            } else {
                errorMessage += errorText;
            }
            
            alert(errorMessage);
        }

    } catch (error) {
        console.error("Error en la conexión:", error);
        alert("⚠️ No se pudo conectar con el servidor. Verifique que el servidor esté ejecutándose.");
    }
});

// Efectos visuales adicionales para los inputs
document.querySelectorAll('input').forEach(input => {
    input.addEventListener('focus', function() {
        this.style.transform = 'translateY(-2px)';
        this.style.boxShadow = '0 5px 15px rgba(125, 60, 255, 0.2)';
    });
    
    input.addEventListener('blur', function() {
        this.style.transform = 'translateY(0)';
        this.style.boxShadow = '0 2px 5px rgba(0, 0, 0, 0.1)';
    });
});

// Efecto de carga en el botón de registro
document.querySelector('button[type="submit"]').addEventListener('click', function(e) {
    const button = this;
    const originalText = button.textContent;
    
    // Solo mostrar efecto de carga si el formulario es válido
    if (document.getElementById("registerForm").checkValidity()) {
        button.innerHTML = '⏳ Registrando...';
        button.disabled = true;
        
        // Restaurar después de 5 segundos máximo (en caso de error)
        setTimeout(() => {
            button.innerHTML = originalText;
            button.disabled = false;
        }, 5000);
    }
});
</script>
</body>
</html>
