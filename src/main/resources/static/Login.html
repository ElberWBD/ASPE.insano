<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Login-estilos/main.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Inter:wght@300;400;600;700&display=swap' rel='stylesheet'>
    <title>Acceso y Registro As.Pe.</title>
</head>
<body>
    <div class="contenido">
        <div class="curved-shape"></div>
        <div class="curved-shape2"></div>
        
        <!-- LOGIN -->
        <div class="form-box Login">
            <h2 class="animation" style="--D:0; --S:21">
                <img src="IMG/02.jpg" alt="Logo As.Pe." class="title-logo"> As.Pe
            </h2>

            <form id="loginForm">
                <div class="input-box animation" style="--D:1; --S:22">
                    <input type="email" id="email_login" required>
                    <label>Correo Electrónico</label>
                    <i class='bx bx-user'></i> 
                </div>

                <div class="input-box animation" style="--D:2; --S:23">
                    <input type="password" id="password_login" required>
                    <label>Contraseña</label>
                    <i class='bx bx-lock'></i> 
                </div>

                <div class="input-box animation" style="--D:3; --S:24">
                    <button class="btn" type="submit">Iniciar Sesión</button>
                </div>

                <div class="regi-link animation" style="--D:4; --S:25">
                    <p>¿No tienes cuenta? <a href="#" class="SignUpLink">Crear Cuenta</a></p>
                </div>
            </form>
        </div>

        <div class="info-content Login">
            <h2 class="animation" style="--D:0; --S:20">¡Bienvenido!</h2>
            <p class="animation" style="--D:1; --S:21">
                Inicia sesión para acceder a tu panel.
            </p>
        </div>

        <!-- REGISTER -->
        <div class="form-box Register">
            <h2 class="animation" style="--li:17; --S:0">Registrarse</h2>

            <form id="registerForm">

    <div class="grid-register">   <!-- ✅ NUEVO CONTENEDOR PARA 2 COLUMNAS -->

        <div class="input-box animation" style="--li:18; --S:1">
            <input type="text" id="nombre" required>
            <label>Nombre</label>
            <i class='bx bx-user'></i> 
        </div>

        <div class="input-box animation" style="--li:19; --S:2">
            <input type="text" id="apellido" required>
            <label>Apellido</label>
            <i class='bx bx-user-circle'></i> 
        </div>

        <div class="input-box animation" style="--li:20; --S:3">
            <input type="text" id="razon_social">
            <label>Razón Social (Opcional)</label>
            <i class='bx bx-buildings'></i> 
        </div>

        <div class="input-box animation" style="--li:21; --S:4">
            <input type="email" id="email_register" required>
            <label>Correo</label>
            <i class='bx bx-envelope'></i> 
        </div>

        <div class="input-box animation" style="--li:22; --S:5">
            <input type="text" id="telefono">
            <label>Teléfono</label>
            <i class='bx bx-phone'></i> 
        </div>

        <div class="input-box animation" style="--li:23; --S:6">
            <input type="password" id="password_register" required>
            <label>Contraseña</label>
            <i class='bx bx-lock'></i> 
        </div>

    </div> <!-- FIN grid-register -->

    <!-- Botón fuera para que quede abajo a lo ancho -->
    <div class="input-box animation" style="--li:24; --S:7">
        <button class="btn" type="submit">Registrarse</button>
    </div>

    <div class="regi-link animation" style="--li:25; --S:8">
        <p>¿Ya tienes cuenta? <a href="#" class="SignInLink">Iniciar Sesión</a></p>
    </div>

</form>

        </div>

        <div class="info-content Register">
            <h2 class="animation" style="--li:17; --S:0">¡Únete al equipo!</h2>
            <p class="animation" style="--li:18; --S:1">
                Regístrate para obtener acceso completo a nuestras herramientas y beneficios.
            </p>
        </div>
    </div>

    <script src="JS/Script8.js"></script>
</body>
</html>
