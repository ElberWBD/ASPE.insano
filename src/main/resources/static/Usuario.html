<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Usuario</title>
  <link rel="stylesheet" href="CSS/Usuario.css">
</head>
<body>
  <div class="contenedor">
    <aside class="barra">
      <h2>Usuario</h2>
      <ul>
        <!-- Cada elemento llama a mostrarSeccion con el id de la sección y pasa this para marcarlo activo -->
        <li id="nav-datos" class="activo" onclick="mostrarSeccion('datos', this)">Datos</li>
        <li id="nav-campanas" onclick="mostrarSeccion('campanas', this)">Campañas</li>
        <li id="nav-eliminar" onclick="mostrarSeccion('eliminar', this)">Eliminar cuenta</li>
        <li onclick="volverInicio()">Volver</li>
      </ul>
    </aside>
    <main class="contenido">
      <!-- Sección Datos: muestra y permite editar los datos del cliente -->
      <section id="datos" class="seccion activa">
        <h2>Datos del Usuario</h2>
        <form class="formulario" onsubmit="event.preventDefault(); guardarCambios();">
          <div class="campo">
            <label>ID:</label>
            <input id="idCliente" type="text" readonly>
          </div>
          <div class="campo">
            <label>Nombre:</label>
            <input id="nombre" type="text">
          </div>
          <div class="campo">
            <label>Apellido:</label>
            <input id="apellido" type="text">
          </div>
          <div class="campo">
            <label>Razón Social:</label>
            <input id="razonSocial" type="text">
          </div>
          <div class="campo">
            <label>Email:</label>
            <input id="email" type="email">
          </div>
          <div class="campo">
            <label>Teléfono:</label>
            <input id="telefono" type="text">
          </div>
          <div class="campo">
            <label>Contraseña:</label>
            <div style="display: flex; align-items: center; gap: 5px;">
              <input id="password" type="password">
              <button type="button" id="togglePassword">👁</button>
            </div>
          </div>
          <div class="campo">
            <label>Fecha de creación:</label>
            <input id="fechaCreacion" type="text" readonly>
          </div>
          <button type="submit">Guardar Cambios</button>
        </form>
      </section>
      <!-- Sección Campañas: navegación interna y contenedores para listar y crear campañas -->
      <section id="campanas" class="seccion">
        <h2>Campañas</h2>
        <div class="tabs-campanas">
          <button id="btnMisCampanas" class="tab-button" onclick="mostrarMisCampanas()">Mis campañas</button>
        </div>
        <!-- Listado de campañas -->
        <div id="mis-campanas" class="subseccion">
          <div id="listaCampanas" class="lista-campanas"></div>
        </div>
        <!-- Formulario para crear una nueva campaña -->
        <div id="nueva-campana" class="subseccion" style="display:none;">
          <form id="formNuevaCampana" onsubmit="crearCampana(event)">
            <div class="campo">
              <label>Nombre:</label>
              <input type="text" id="nombreCampana" required>
            </div>
            <div class="campo">
              <label>Descripción:</label>
              <textarea id="descripcionCampana" required></textarea>
            </div>
            <div class="campo">
              <label>Fecha inicio:</label>
              <input type="date" id="fechaInicioCampana" required>
            </div>
            <div class="campo">
              <label>Fecha fin:</label>
              <input type="date" id="fechaFinCampana" required>
            </div>
            <div class="campo">
              <label>Presupuesto:</label>
              <input type="number" id="presupuestoCampana" min="0" required>
            </div>
            <div class="campo">
              <label>Entregables (opcional):</label>
              <input type="file" id="entregablesCampana" multiple>
            </div>
            <button type="submit">Crear campaña</button>
          </form>
        </div>
      </section>
      <!-- Sección Eliminar: elimina la cuenta del cliente -->
      <section id="eliminar" class="seccion">
        <h2>Eliminar Cuenta</h2>
        <p>Esta acción eliminará permanentemente tu cuenta y todos tus datos.</p>
        <button class="eliminar-btn" onclick="eliminarCuenta()">Eliminar Cuenta</button>
      </section>
    </main>
  </div>
  <!-- Modal para mostrar detalles de campaña -->
  <div id="modal" class="modal" style="display:none;">
    <div id="modal-content" class="modal-contenido">
      <span class="cerrar" onclick="cerrarModal()">&times;</span>
    </div>
  </div>

   <script src="JS/ChatUser.js"></script>


</body>
</html>
